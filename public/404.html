<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404: This page could not be found.</title>
		<style>
			body {
				color: #000;
				background: #fff;
				margin: 0;
				font-family:
					system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif,
					"Apple Color Emoji", "Segoe UI Emoji";
			}
			.wrap {
				height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
			}
			.inner {
				display: inline-block;
			}
			h1 {
				display: inline-block;
				margin: 0 20px 0 0;
				padding: 0 23px 0 0;
				font-size: 24px;
				font-weight: 500;
				vertical-align: top;
				line-height: 49px;
				border-right: 1px solid rgba(0, 0, 0, 0.3);
			}
			.desc {
				display: inline-block;
			}
			h2 {
				font-size: 14px;
				font-weight: 400;
				line-height: 49px;
				margin: 0;
			}
			@media (prefers-color-scheme: dark) {
				body {
					color: #fff;
					background: #000;
				}
				h1 {
					border-right: 1px solid rgba(255, 255, 255, 0.3);
				}
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<div class="inner">
				<h1>404</h1>
				<div class="desc"><h2>This page could not be found.</h2></div>
			</div>
		</div>
	</body>
</html>
