# .github/dependabot.yml — Dependabot version updates (per repo-standards Wave 3)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependency", "chore"]
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependency", "chore"]
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the native (Go) compiler and ships no JS compiler API;
      # typescript-eslint (peer: typescript <6.1) crashes on load against it.
      # Drop this once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
